name: 配布 zip 生成

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: registry.csv を検証する
        run: python scripts/migrater.py validate

      - name: resourcepack.zip を組み立てる
        run: python scripts/generator.py

      - name: Pages 用ファイルを組み立てる
        run: |
          mkdir -p dist
          cp resourcepack.zip dist/resourcepack.zip
          cat <<'EOF' > dist/index.html
          <!doctype html>
          <html lang="ja">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>rp_adw 配布</title>
          </head>
          <body>
            <main>
              <h1>rp_adw 配布</h1>
              <p><a href="./resourcepack.zip">resourcepack.zip をダウンロード</a></p>
            </main>
          </body>
          </html>
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: resourcepack
          path: resourcepack.zip
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
